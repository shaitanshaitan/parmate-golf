# ─── Parmate · Netlify Configuration ───
# One repo, two apps:
#   parmate.golf              → public website (index.html + assets/)
#   parmate.golf/organizers/  → organiser / admin tool, parked and not linked from the site
#                               (moves to organizations.parmate.golf later)
#   play.parmate.golf  → player app (player/index.html)

[build]
  publish = "."

# ── Firebase sign-in helpers on our own domain (Release 3a) ──
# Google sign-in runs through https://play.parmate.golf/__/auth/... instead of
# whs-teamhcp-trg-26-app.firebaseapp.com, so the Google screen shows our own domain and
# browsers that block cross-site storage keep working. Must stay ABOVE the player rule:
# Netlify uses the first rule that matches. 200 = transparent proxy (a 301/302 breaks it).
[[redirects]]
  from   = "https://play.parmate.golf/__/*"
  to     = "https://whs-teamhcp-trg-26-app.firebaseapp.com/__/:splat"
  status = 200
  force  = true

# ── Serve player app on play subdomain ──
[[redirects]]
  from   = "https://play.parmate.golf/*"
  to     = "/player/:splat"
  status = 200
  force  = true

# ── Service worker must be served from subdomain root ──
[[redirects]]
  from   = "https://play.parmate.golf/sw.js"
  to     = "/player/sw.js"
  status = 200
  force  = true

# ── Manifest ──
[[redirects]]
  from   = "https://play.parmate.golf/manifest.json"
  to     = "/player/manifest.json"
  status = 200
  force  = true

# ── Pro is only bought inside the player app (play.parmate.golf). Mollie's redirectUrl is
#    <site>/?upgrade=complete, and <site> is parmate.golf, now the website. Send the player
#    straight back to the app.
[[redirects]]
  from   = "/"
  to     = "https://play.parmate.golf/?upgrade=:upgrade"
  query  = {upgrade = ":upgrade"}
  status = 302
  force  = true

# ── Old admin entry points → organiser tool ──
[[redirects]]
  from   = "/admin"
  to     = "/organizers/"
  status = 301

[[redirects]]
  from   = "/organisers/*"
  to     = "/organizers/:splat"
  status = 301

[[headers]]
  for = "/organizers/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/player-submit.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── Headers for PWA files ──
[[headers]]
  for = "/player/sw.js"
  [headers.values]
    Content-Type  = "application/javascript"
    Cache-Control = "no-cache"

[[headers]]
  for = "/player/manifest.json"
  [headers.values]
    Content-Type  = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/player/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers for both apps ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
