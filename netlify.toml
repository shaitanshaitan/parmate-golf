# ─── Parmate · Netlify Configuration ───
# One repo, two apps:
#   parmate.golf       → admin app (index.html)
#   play.parmate.golf  → player app (player/index.html)

[build]
  publish = "."

# ── Firebase sign-in helpers on our own domain (Release 3a) ──
# Google sign-in runs through https://play.parmate.golf/__/auth/... instead of
# whs-teamhcp-trg-26-app.firebaseapp.com, so the Google screen shows our own domain and
# browsers that block cross-site storage keep working. Must stay ABOVE the player rule:
# Netlify uses the first rule that matches. 200 = transparent proxy (a 301/302 breaks it).
[[redirects]]
  from   = "https://play.parmate.golf/__/*"
  to     = "https://whs-teamhcp-trg-26-app.firebaseapp.com/__/:splat"
  status = 200
  force  = true

# ── Serve player app on play subdomain ──
[[redirects]]
  from   = "https://play.parmate.golf/*"
  to     = "/player/:splat"
  status = 200
  force  = true

# ── Service worker must be served from subdomain root ──
[[redirects]]
  from   = "https://play.parmate.golf/sw.js"
  to     = "/player/sw.js"
  status = 200
  force  = true

# ── Manifest ──
[[redirects]]
  from   = "https://play.parmate.golf/manifest.json"
  to     = "/player/manifest.json"
  status = 200
  force  = true

# ── Headers for PWA files ──
[[headers]]
  for = "/player/sw.js"
  [headers.values]
    Content-Type  = "application/javascript"
    Cache-Control = "no-cache"

[[headers]]
  for = "/player/manifest.json"
  [headers.values]
    Content-Type  = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/player/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers for both apps ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
